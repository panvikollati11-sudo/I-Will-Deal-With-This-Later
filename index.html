<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Space</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #10131a;
        --panel: #181d27;
        --panel-light: #202735;
        --border: #30394b;
        --text: #f4f7fb;
        --muted: #9ba8bc;
        --accent: #73a7ff;
        --accent-dark: #3469bd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top right, #1b2c4e 0, transparent 38%),
          var(--background);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .app {
        width: min(1400px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 32px clamp(20px, 4vw, 56px);
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.5rem);
        letter-spacing: -0.05em;
      }

      .subtitle {
        max-width: 520px;
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 16px;
        color: var(--text);
        background: var(--panel-light);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
      }

      button:hover {
        border-color: var(--accent);
        background: #293752;
        transform: translateY(-1px);
      }

      .run {
        border-color: var(--accent-dark);
        background: var(--accent-dark);
      }

      .run:hover {
        background: #427bd4;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
        min-height: 560px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(24, 29, 39, 0.9);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
      }

      .editor-panel,
      .preview-panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .editor-panel {
        border-right: 1px solid var(--border);
      }

      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 54px;
        padding: 0 18px;
        border-bottom: 1px solid var(--border);
      }

      .panel-heading h2 {
        margin: 0;
        font-size: 0.95rem;
      }

      .status {
        color: var(--muted);
        font-size: 0.78rem;
      }

      .editor {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        background: #0d1117;
      }

      .line-numbers {
        width: 48px;
        padding: 18px 12px;
        color: #536077;
        font: 14px/1.65 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        text-align: right;
        user-select: none;
      }

      textarea {
        flex: 1;
        width: 100%;
        resize: none;
        border: 0;
        outline: 0;
        padding: 18px 16px 18px 4px;
        color: #d9e5ff;
        background: transparent;
        font: 14px/1.65 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        tab-size: 2;
      }

      .preview {
        flex: 1;
        min-height: 0;
        padding: 14px;
        background: #fff;
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: 470px;
        border: 0;
        border-radius: 8px;
        background: white;
      }

      .tip {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 0.83rem;
      }

      kbd {
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 5px;
        color: var(--text);
        background: var(--panel-light);
        font-family: inherit;
      }

      @media (max-width: 800px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        .editor-panel {
          min-height: 480px;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <p class="eyebrow">Your personal playground</p>
          <h1>Code Space</h1>
          <p class="subtitle">
            Write HTML, CSS, and JavaScript on the left. Press run to see your page come alive
            on the right.
          </p>
        </div>
        <div class="actions">
          <button id="resetButton" type="button">Reset</button>
          <button id="downloadButton" type="button">Download HTML</button>
          <button class="run" id="runButton" type="button">▶ Run code</button>
        </div>
      </header>

      <section class="workspace" aria-label="Code playground">
        <div class="editor-panel">
          <div class="panel-heading">
            <h2>Editor</h2>
            <span class="status" id="status">Ready</span>
          </div>
          <div class="editor">
            <div class="line-numbers" id="lineNumbers" aria-hidden="true">1</div>
            <textarea id="codeEditor" spellcheck="false" aria-label="HTML code editor"></textarea>
          </div>
        </div>
        <div class="preview-panel">
          <div class="panel-heading">
            <h2>Preview</h2>
            <span class="status">Live in your browser</span>
          </div>
          <div class="preview">
            <iframe id="previewFrame" title="Rendered code preview" sandbox="allow-scripts"></iframe>
          </div>
        </div>
      </section>

      <p class="tip">Tip: use <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run your code.</p>
    </main>

    <script>
      const starterCode = `<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My first website</title>
    <style>
      body { font-family: system-ui; padding: 2rem; }
      button { padding: 0.6rem 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Hello!</h1>
    <p>This is my first website.</p>
    <button onclick="alert('You clicked it!')">Click me</button>
  </body>
</html>`;

      const editor = document.querySelector("#codeEditor");
      const preview = document.querySelector("#previewFrame");
      const lineNumbers = document.querySelector("#lineNumbers");
      const status = document.querySelector("#status");

      function updateLineNumbers() {
        const lineCount = editor.value.split("\n").length;
        lineNumbers.textContent = Array.from({ length: lineCount }, (_, index) => index + 1).join(
          "\n"
        );
      }

      function runCode() {
        preview.srcdoc = editor.value;
        status.textContent = `Updated ${new Date().toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
        })}`;
      }

      editor.value = starterCode;
      updateLineNumbers();
      runCode();

      editor.addEventListener("input", updateLineNumbers);
      editor.addEventListener("scroll", () => {
        lineNumbers.scrollTop = editor.scrollTop;
      });
      document.querySelector("#runButton").addEventListener("click", runCode);
      document.querySelector("#resetButton").addEventListener("click", () => {
        editor.value = starterCode;
        updateLineNumbers();
        runCode();
      });
      document.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          event.preventDefault();
          runCode();
        }
      });
      document.querySelector("#downloadButton").addEventListener("click", () => {
        const blob = new Blob([editor.value], { type: "text/html" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "my-code.html";
        link.click();
        URL.revokeObjectURL(link.href);
      });
    </script>
  </body>
</html>
